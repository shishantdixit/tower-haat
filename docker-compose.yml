# Local SQL Server for machines without LocalDB (macOS, Linux). See README.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - towerhaat-sql:/var/opt/mssql

volumes:
  towerhaat-sql:
